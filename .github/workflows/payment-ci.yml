name: Payment Service CI/CD

on:
  push:
    paths:
      - 'backend/payment-service/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-payment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/payment-service

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run Tests
      run: mvn test

    - name: Build Package
      run: mvn clean package

    - name: SonarCloud Scan
      run: |
        mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=dewminichristine2002_Order-Processing-System \
          -Dsonar.organization=dewminichristine2002 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Payment Service
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/payment-service:${{ github.sha }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/payment-service:${{ github.sha }}
        docker tag ${{ secrets.DOCKER_USERNAME }}/payment-service:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/payment-service:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/payment-service:latest